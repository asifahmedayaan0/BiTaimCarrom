name: Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  APK_PATH: app/build/outputs/apk/debug/app-debug.apk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" --install "platforms;android-34" "build-tools;34.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Rename APK for download
        run: cp "$APK_PATH" BiTaimCarrom.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BiTaimCarrom-debug-apk
          path: BiTaimCarrom.apk
          if-no-files-found: error
          retention-days: 30
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: BiTaimCarrom.apk
          generate_release_notes: true
